name: CI

on:
  push:
  pull_request:

# CI 不需要任何真实配置：
#   - 不读取 .env（测试全部通过显式 env 对象注入配置）
#   - 不需要 TARGET_QQ / NAPCAT_TOKEN
#   - 不调用真实 NapCat、不发送 QQ 消息
#   - 不依赖实时 Warframe API（official provider 使用仓库内的最小 fixture）
#   - 不依赖代理

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warframe-fissure-monitor

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: warframe-fissure-monitor/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
